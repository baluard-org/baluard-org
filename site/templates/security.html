{% extends "base.html" %}

{% block head_extra %}
<style>
  .white-paper-container {
    max-width: 820px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 6rem;
  }

  .paper-back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.88rem;
    color: var(--site-accent);
    margin-bottom: 2rem;
    font-weight: 500;
  }

  .paper-back-link:hover {
    text-decoration: underline;
  }

  .white-paper-article {
    color: var(--site-text);
    font-size: 1.05rem;
    line-height: 1.75;
  }

  .white-paper-article h1 {
    font-size: clamp(2.2rem, 4.5vw, 3.2rem);
    line-height: 1.15;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin-bottom: 1.5rem;
    color: var(--site-text);
  }

  .white-paper-article h2 {
    font-size: clamp(1.4rem, 2.5vw, 1.85rem);
    line-height: 1.25;
    letter-spacing: -0.02em;
    font-weight: 700;
    margin: 3.5rem 0 1.25rem;
    padding-top: 2rem;
    border-top: 1px solid var(--site-border);
    color: var(--site-text);
  }

  .white-paper-article h3 {
    font-size: 1.25rem;
    line-height: 1.35;
    font-weight: 700;
    margin: 2.25rem 0 0.85rem;
    color: var(--site-text);
  }

  .white-paper-article p {
    margin-bottom: 1.35rem;
    color: var(--site-text-secondary);
  }

  .white-paper-article ul, .white-paper-article ol {
    margin: 0 0 1.5rem;
    padding-left: 1.5rem;
    color: var(--site-text-secondary);
  }

  .white-paper-article li {
    margin-bottom: 0.5rem;
    line-height: 1.65;
  }

  .white-paper-article code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--site-bg-surface);
    border: 1px solid var(--site-border);
    border-radius: var(--radius-sm);
    padding: 0.15em 0.4em;
    color: var(--app-primary);
  }

  .white-paper-article pre {
    background: #050608;
    border: 1px solid var(--site-border);
    border-radius: var(--radius-md);
    padding: 1.25rem;
    overflow-x: auto;
    margin: 1.5rem 0;
  }

  .white-paper-article pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: #e2e8f0;
  }

  .white-paper-article table {
    width: 100%;
    border-collapse: collapse;
    margin: 2rem 0;
    font-size: 0.92rem;
  }

  .white-paper-article th, .white-paper-article td {
    border: 1px solid var(--site-border);
    padding: 0.75rem 1rem;
    text-align: left;
  }

  .white-paper-article th {
    background: var(--site-bg-surface);
    font-weight: 600;
    color: var(--site-text);
  }

  .white-paper-article td {
    color: var(--site-text-secondary);
  }

  .white-paper-article blockquote {
    border-left: 3px solid var(--site-accent);
    padding-left: 1.25rem;
    margin: 1.5rem 0;
    color: var(--site-text-muted);
    font-style: italic;
  }
</style>
{% endblock head_extra %}

{% block content %}
<div class="white-paper-container">
  <a href="/" class="paper-back-link">&larr; Back to baluard.app</a>
  <article class="white-paper-article">
    {{ page.content | safe }}
  </article>
</div>
{% endblock content %}
